<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>

    <div class="top-actions">
        <a class="btn btn-accent add-btn" href="{{ url_for('add') }}">Add New Post</a>
    </div>

    {% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p><em>Written by {{ post.author }}</em></p>
        <p>{{ post.content }}</p>

        <div class="action-row">
            <form class="action-form" method="GET" action="{{ url_for('delete', post_id=post.id) }}">
                <button class="btn btn-accent" type="submit">Delete</button>
            </form>

            <form class="action-form" method="GET" action="{{ url_for('update', post_id=post.id) }}">
                <button class="btn btn-accent" type="submit">Update</button>
            </form>
        </div>
    </div>
    {% endfor %}
</body>
</html>
